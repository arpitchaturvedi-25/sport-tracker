{% extends "base.html" %}
{% block title %}Login — SportTracker{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-icon"><i class="fa-solid fa-person-running"></i></div>
    <h2>Welcome Back</h2>
    <p class="auth-sub">Log in to continue tracking your progress.</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
  </div>
</section>
{% endblock %}
