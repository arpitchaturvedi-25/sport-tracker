{% extends "base.html" %}
{% block title %}Sign Up — SportTracker{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-icon"><i class="fa-solid fa-person-running"></i></div>
    <h2>Create Your Account</h2>
    <p class="auth-sub">Start tracking your fitness journey today.</p>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</section>
{% endblock %}
