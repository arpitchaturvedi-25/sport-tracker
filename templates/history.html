{% extends "base.html" %}

{% block title %}History{% endblock %}

{% block content %}

<h1>Activity History</h1>

<table border="1">
    <tr>
        <th>Date</th>
        <th>Steps</th>
        <th>Distance</th>
        <th>Calories</th>
    </tr>

    {% for record in records %}
    <tr>
        <td>{{ record.date }}</td>
        <td>{{ record.steps }}</td>
        <td>{{ record.distance }}</td>
        <td>{{ record.calories }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
